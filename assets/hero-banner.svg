<svg viewBox="0 0 980 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="John Franklin Bugauisan - Full-Stack Developer and Applied AI Engineer">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B11"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="meshGlow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="accentGlow" cx="20%" cy="90%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="980" height="240" rx="16" fill="url(#bgGrad)"/>
  <rect width="980" height="240" rx="16" fill="url(#meshGlow)"/>
  <rect width="980" height="240" rx="16" fill="url(#accentGlow)"/>
  <rect width="980" height="240" rx="16" fill="url(#grid)"/>
  <rect width="980" height="240" rx="16" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Status Pill -->
  <g transform="translate(48, 36)">
    <rect width="236" height="28" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#10B981"/>
    <text x="28" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="0.5">OPEN TO WORK AND CONSULTING</text>
  </g>

  <!-- Name and Title -->
  <text x="48" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">John Franklin Bugauisan</text>
  <text x="48" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="url(#blueGlow)">Full-Stack Developer and Applied AI Engineer</text>
  <text x="48" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#94A3B8">Building production-grade web, mobile, and agentic AI systems end to end.</text>

  <!-- Badges / Tags -->
  <g transform="translate(48, 196)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
    <g transform="translate(0, 0)">
      <rect width="118" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
      <text x="14" y="16" fill="#38BDF8">SanX Studio</text>
    </g>
    <g transform="translate(126, 0)">
      <rect width="118" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
      <text x="14" y="16" fill="#818CF8">Flyrank AI</text>
    </g>
    <g transform="translate(252, 0)">
      <rect width="132" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
      <text x="14" y="16" fill="#34D399">ICT Champion</text>
    </g>
  </g>

  <!-- Decorative Right-Side Graphic: Modern Tech Blueprint Card -->
  <g transform="translate(710, 36)">
    <rect width="220" height="168" rx="12" fill="#0B132B" fill-opacity="0.85" stroke="#1E293B" stroke-width="1.2"/>
    
    <!-- Card Header / Terminal Dots -->
    <circle cx="18" cy="18" r="4" fill="#EF4444" opacity="0.8"/>
    <circle cx="32" cy="18" r="4" fill="#F59E0B" opacity="0.8"/>
    <circle cx="46" cy="18" r="4" fill="#10B981" opacity="0.8"/>
    <line x1="0" y1="32" x2="220" y2="32" stroke="#1E293B" stroke-width="1"/>

    <!-- Code Snippet -->
    <text x="16" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#64748B">// Architecture</text>
    <text x="16" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#38BDF8">const <tspan fill="#F8FAFC">stack</tspan> = {</text>
    <text x="26" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">core: <tspan fill="#FCD34D">'Next.js'</tspan>,</text>
    <text x="26" y="114" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">api:  <tspan fill="#FCD34D">'FastAPI'</tspan>,</text>
    <text x="26" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">ai:   <tspan fill="#FCD34D">'RAG / Agents'</tspan></text>
    <text x="16" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#38BDF8">};</text>
  </g>
</svg>
