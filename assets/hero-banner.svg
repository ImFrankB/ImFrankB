<svg viewBox="0 0 980 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="John Franklin Bugauisan — Full-Stack Developer and Applied AI Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F3"/>
      <stop offset="100%" stop-color="#F1ECE1"/>
    </linearGradient>
    <linearGradient id="uiTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B7CFF"/>
      <stop offset="100%" stop-color="#2952FF"/>
    </linearGradient>
    <linearGradient id="aiTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9270"/>
      <stop offset="100%" stop-color="#FF6B4A"/>
    </linearGradient>
    <linearGradient id="apiTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#525B72"/>
      <stop offset="100%" stop-color="#363C4D"/>
    </linearGradient>
    <linearGradient id="opsTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8CBAE"/>
      <stop offset="100%" stop-color="#B9A87F"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2952FF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#2952FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#E7E0CE"/>
    </pattern>
  </defs>

  <style>
    @keyframes floatA { 0% { transform: translateY(0); } 100% { transform: translateY(-9px); } }
    @keyframes floatB { 0% { transform: translateY(0) rotate(0deg); } 100% { transform: translateY(-6px) rotate(1.2deg); } }
    @keyframes spin   { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes pulse  { 0% { opacity: 0.22; } 100% { opacity: 0.6; } }
    .slab-ops { animation: floatB 5.6s ease-in-out infinite alternate; }
    .slab-api { animation: floatA 4.8s ease-in-out infinite alternate; animation-delay: .3s; }
    .slab-ai  { animation: floatB 5.1s ease-in-out infinite alternate; animation-delay: .6s; }
    .slab-ui  { animation: floatA 4.4s ease-in-out infinite alternate; animation-delay: .9s; }
    .orbit    { transform-origin: 730px 150px; animation: spin 13s linear infinite; }
    .wire     { animation: pulse 3.2s ease-in-out infinite alternate; }
  </style>

  <rect width="980" height="300" rx="18" fill="url(#bg)" stroke="#E4DDCF"/>
  <rect width="980" height="300" rx="18" fill="url(#dots)"/>
  <circle cx="730" cy="150" r="140" fill="url(#glow)"/>

  <!-- status pill -->
  <rect x="48" y="38" width="200" height="26" rx="13" fill="#FFFFFF" stroke="#E4DDCF"/>
  <circle cx="63" cy="51" r="4" fill="#3FA66B"/>
  <text x="76" y="55" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#726C5F" letter-spacing="0.3">Open to select work</text>

  <!-- name / tagline / description -->
  <text x="48" y="112" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="33" font-weight="800" fill="#1F1C18">John Franklin Bugauisan</text>
  <text x="48" y="140" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#2952FF">Full-Stack Developer &amp; Applied AI Engineer</text>
  <text x="48" y="164" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#726C5F">Building grounded web, mobile, and AI systems — end to end.</text>

  <!-- capability chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#1F1C18">
    <rect x="48" y="188" width="112" height="24" rx="12" fill="#E9EEFF"/>
    <text x="60" y="204">Web &amp; Mobile</text>

    <rect x="168" y="188" width="118" height="24" rx="12" fill="#EFEBE3"/>
    <text x="180" y="204">FastAPI · Node</text>

    <rect x="294" y="188" width="112" height="24" rx="12" fill="#FFE9E1"/>
    <text x="306" y="204">Agentic RAG</text>

    <rect x="414" y="188" width="98" height="24" rx="12" fill="#F1ECE1"/>
    <text x="426" y="204">Git · Cloud</text>
  </g>

  <!-- connecting wires between stacked layers -->
  <g class="wire" stroke="#C9C0AA" stroke-width="1.4" stroke-dasharray="3,5" fill="none">
    <line x1="730" y1="225" x2="730" y2="185"/>
    <line x1="730" y1="183" x2="730" y2="143"/>
    <line x1="730" y1="141" x2="730" y2="101"/>
  </g>

  <!-- OPS — Delivery & Tooling (foundation) -->
  <g class="slab-ops" transform="translate(640,205)">
    <polygon points="85,0 170,17 85,34 0,17" fill="url(#opsTop)"/>
    <polygon points="0,17 85,34 85,62 0,45" fill="#A99872"/>
    <polygon points="85,34 170,17 170,45 85,62" fill="#8E7E5E"/>
  </g>

  <!-- API — Backend Systems & Data -->
  <g class="slab-api" transform="translate(620,163)">
    <polygon points="85,0 170,17 85,34 0,17" fill="url(#apiTop)"/>
    <polygon points="0,17 85,34 85,62 0,45" fill="#2A2E3B"/>
    <polygon points="85,34 170,17 170,45 85,62" fill="#1D202A"/>
  </g>

  <!-- AI — Applied AI & Retrieval -->
  <g class="slab-ai" transform="translate(640,121)">
    <polygon points="85,0 170,17 85,34 0,17" fill="url(#aiTop)"/>
    <polygon points="0,17 85,34 85,62 0,45" fill="#D9522F"/>
    <polygon points="85,34 170,17 170,45 85,62" fill="#B8431F"/>
  </g>

  <!-- UI — Product Interfaces (top) -->
  <g class="slab-ui" transform="translate(620,79)">
    <polygon points="85,0 170,17 85,34 0,17" fill="url(#uiTop)"/>
    <polygon points="0,17 85,34 85,62 0,45" fill="#1E3AC7"/>
    <polygon points="85,34 170,17 170,45 85,62" fill="#152A94"/>
    <circle cx="85" cy="17" r="3" fill="#ffffff"/>
  </g>

  <!-- orbiting signal -->
  <g class="orbit">
    <ellipse cx="730" cy="150" rx="118" ry="46" fill="none" stroke="#FF6B4A" stroke-width="1" stroke-dasharray="5,7" opacity="0.45"/>
    <circle cx="848" cy="150" r="4" fill="#FF6B4A" filter="url(#soft)"/>
  </g>

  <!-- grounding shadow -->
  <ellipse cx="725" cy="248" rx="120" ry="14" fill="#1F1C18" opacity="0.08" filter="url(#soft)"/>
</svg>
